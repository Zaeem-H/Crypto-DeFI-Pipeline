version: "3.8"

# Reusable configuration block for Airflow to keep the file DRY
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    PYTHONPATH: /opt/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: my_super_secret_key_12345
    KAFKA_BROKER: kafka:29092
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./reports:/opt/airflow/reports
  depends_on:
    postgres:
      condition: service_healthy

services:

  # Zookeeper & Kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: crypto_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: crypto_kafka
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # PostgreSQL Database

  postgres:
    image: postgres:14
    container_name: crypto_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # Airflow Services

  airflow-webserver:
    <<: *airflow-common
    container_name: crypto_airflow_webserver
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: crypto_airflow_scheduler
    command: scheduler

  # Streaming Data Producers

  coincap_producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producers
    container_name: coincap_producer
    command: python -m src.kafka.producers.coincap_producer
    depends_on:
      - kafka
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BROKER=kafka:29092 

  coingecko_producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producers
    container_name: coingecko_producer
    command: python -m src.kafka.producers.coingecko_producer
    depends_on:
      - kafka
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BROKER=kafka:29092

  defillama_producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producers
    container_name: defillama_producer
    command: python -m src.kafka.producers.defillama_producer
    depends_on:
      - kafka
    restart: always
    env_file:
      - .env
    environment:
      - KAFKA_BROKER=kafka:29092

  # Live Analytics Dashboard

  analytics_dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: crypto_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8502:8501"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      
volumes:
  postgres_data: